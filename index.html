<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berty | Web Developer Portfolio</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --accent-yellow: #0e4ce9;
        --accent-blue: #0e4ce9;
        --border-color: #334155;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px;
        max-width: 550px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }

      .profile-img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 3px solid var(--accent-yellow);
        margin-bottom: 20px;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 8px;
      }

      h1 span {
        color: var(--accent-yellow);
      }

      p.subtitle {
        color: var(--accent-blue);
        font-weight: 600;
        margin-bottom: 16px;
      }

      p.bio {
        color: var(--text-sub);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .tags {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }

      .tag {
        background-color: #0f172a;
        color: var(--text-main);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        border: 1px solid var(--border-color);
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition:
          transform 0.2s,
          background-color 0.2s;
      }

      .btn-github {
        background-color: #24292e;
        color: #ffffff;
        border: 1px solid var(--border-color);
      }

      .btn-email {
        background-color: var(--accent-yellow);
        color: #0f172a;
      }

      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="https://github.com/berty0.png"
        alt="Berty"
        class="profile-img"
      />
      <h1>Hi, I'm <span>Berty</span> 👋</h1>
      <p class="subtitle">Web Developer & Linux Enthusiast</p>
      <p class="bio">
        Passionate about building clean web interfaces, exploring modern
        JavaScript, and working with open-source tools.
      </p>

      <div class="tags">
        <span class="tag"><i class="fab fa-linux"></i> Linux</span>
        <span class="tag"><i class="fab fa-html5"></i> HTML5</span>
        <span class="tag"><i class="fab fa-css3-alt"></i> CSS3</span>
        <span class="tag"><i class="fab fa-java"></i> Java</span>
        <span class="tag"><i class="fab fa-js"></i> JavaScript</span>
      </div>

      <div class="social-links">
        <a
          href="https://github.com/berty0"
          target="_blank"
          class="btn btn-github"
        >
          <i class="fab fa-github"></i> GitHub Profile
        </a>
        <a href="mailto:matteobertasa2007gmail.com" class="btn btn-email">
          <i class="fas fa-envelope"></i> Contact Me
        </a>
      </div>
    </div>
  </body>
</html>
